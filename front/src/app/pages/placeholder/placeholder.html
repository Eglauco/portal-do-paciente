<section class="dash">
  <header class="dash__head">
    <div>
      <h1 class="dash__greeting">{{ title }}</h1>
      <p class="dash__date">{{ description }}</p>
    </div>
  </header>

  <div class="empty">
    <span class="empty__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h4l2 5 4-12 2 7h6" />
      </svg>
    </span>
    <h2 class="empty__title">Em construção</h2>
    <p class="empty__text">
      Esta área faz parte do roteiro do Portal do Paciente e será desenvolvida em
      breve, seguindo o mesmo padrão visual.
    </p>
    <a class="btn btn--solid" routerLink="/inicio">Voltar para o Início</a>
  </div>
</section>
