spring.application.name=pop

# Porta (Railway injeta PORT; localmente cai em 8080).
server.port=${PORT:8080}

# ===============================
# PostgreSQL DataSource
# Em produção, defina SPRING_DATASOURCE_URL/USERNAME/PASSWORD no ambiente.
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Autenticação (Spring Security / JWT)
# Em produção defina APP_JWT_SECRET (>= 32 bytes) no ambiente.
# ===============================
app.jwt.secret=${APP_JWT_SECRET:troque-este-segredo-de-desenvolvimento-para-producao-0001}
app.jwt.expiration-hours=${APP_JWT_EXPIRATION_HOURS:8}
# Sessão do paciente no app: longa duração (estilo WhatsApp), revogável pela troca de aparelho.
app.jwt.paciente-expiration-days=${APP_JWT_PACIENTE_EXPIRATION_DAYS:365}

# ===============================
# Flyway Migrations
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# Armazenamento de arquivos (MinIO / S3 — Railway)
# O upload é feito direto do navegador para o S3 via URL pré-assinada.
# Defina no Railway: MINIO_BUCKET, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD,
# MINIO_PUBLIC_ENDPOINT e (opcional) MINIO_PRIVATE_ENDPOINT.
# ===============================
storage.bucket=${MINIO_BUCKET:portal-paciente}
storage.access-key=${MINIO_ROOT_USER:}
storage.secret-key=${MINIO_ROOT_PASSWORD:}
# Endpoint público (usado nas URLs pré-assinadas que o navegador acessa).
storage.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
# Endpoint interno (usado pelo backend para operações servidor-a-servidor, ex.: excluir).
storage.internal-endpoint=${MINIO_PRIVATE_ENDPOINT:${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}}
storage.region=${MINIO_REGION:us-east-1}

# Permite upload de arquivos maiores no multipart do próprio Spring (não usado no fluxo S3 direto).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ===============================
# Twilio Verify (OTP do paciente por WhatsApp/SMS)
# Defina no ambiente: TWILIO_ACCOUNT_SID e TWILIO_AUTH_TOKEN (segredos).
# O Verify Service SID não é segredo (fica versionado). Sem as credenciais, a
# verificação falha de forma segura (503) — nunca libera acesso.
# ===============================
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}
# Idioma do OTP (SMS em pt-BR; e casa com o template de WhatsApp aprovado em pt_BR).
twilio.verify-locale=${TWILIO_VERIFY_LOCALE:pt-BR}

# ===============================
# Moderação de comentários por IA (Claude / Anthropic)
# Defina ANTHROPIC_API_KEY no ambiente. Sem a chave, a moderação falha de forma
# SEGURA (fail-closed): o comentário fica pendente para o admin revisar.
# ===============================
anthropic.api-key=${ANTHROPIC_API_KEY:}
# Modelo mais simples que resolve a classificação de ofensa.
anthropic.moderacao.modelo=${ANTHROPIC_MODERACAO_MODELO:claude-haiku-4-5}
# Timeout da chamada de moderação (segundos): estourou = fail-closed (pendente).
anthropic.moderacao.timeout-segundos=${ANTHROPIC_MODERACAO_TIMEOUT:12}

# ===============================
# Chat ao vivo com IA (assistente virtual do primeiro atendimento)
# Reaproveita a MESMA ANTHROPIC_API_KEY. Ao contrário da moderação, aqui a falha é FAIL-OPEN:
# se a IA não responder, a conversa é escalada na hora para atendimento humano.
# ===============================
# Modelo do chat: Haiku por padrão (baixo custo/latência); dá pra subir p/ um modelo maior por env.
anthropic.chat.modelo=${ANTHROPIC_CHAT_MODELO:claude-haiku-4-5}
# Teto de tokens da resposta ao paciente.
anthropic.chat.max-tokens=${ANTHROPIC_CHAT_MAX_TOKENS:600}
# Timeout da chamada (segundos): estourou = escala para humano (fail-open).
anthropic.chat.timeout-segundos=${ANTHROPIC_CHAT_TIMEOUT:20}
# Quantas mensagens recentes da conversa mandar como histórico para a IA.
anthropic.chat.historico-maximo=${ANTHROPIC_CHAT_HISTORICO:12}

# ===============================
# Análise de documentos do prontuário por IA
# Reaproveita a MESMA ANTHROPIC_API_KEY. Aqui a precisão pesa mais que o custo (ex.: laudo com
# indício de câncer) → modelo Opus por padrão; a IA é apoio e o alerta sempre exige validação humana.
# ===============================
# Modelo da análise clínica (mais capaz; configurável).
anthropic.prontuario.modelo=${ANTHROPIC_PRONTUARIO_MODELO:claude-opus-5}
# Teto de tokens do resumo/alerta.
anthropic.prontuario.max-tokens=${ANTHROPIC_PRONTUARIO_MAX_TOKENS:1500}
# Timeout da chamada (segundos): Opus + PDF é mais lento; estourou = fica "não analisado" (reanalisar).
anthropic.prontuario.timeout-segundos=${ANTHROPIC_PRONTUARIO_TIMEOUT:90}

# ===============================
# ZapSign (assinatura eletrônica do TCLE) — POC/sandbox
# Defina ZAPSIGN_API_TOKEN no ambiente (NUNCA versionar o token). O padrão da base é o SANDBOX
# (sem validade jurídica). Em produção, aponte ZAPSIGN_BASE_URL para https://api.zapsign.com.br/api/v1
# e use o token de produção. webhook-secret: header compartilhado que o backend exige no /zapsign/webhook
# (e que registramos no webhook da ZapSign) — o único mecanismo de autenticidade (a ZapSign não assina HMAC).
# ===============================
zapsign.base-url=${ZAPSIGN_BASE_URL:https://sandbox.api.zapsign.com.br/api/v1}
zapsign.api-token=${ZAPSIGN_API_TOKEN:}
zapsign.webhook-secret=${ZAPSIGN_WEBHOOK_SECRET:poc-local-secret}
# Timeouts da chamada HTTP (segundos).
zapsign.connect-timeout-segundos=${ZAPSIGN_CONNECT_TIMEOUT:5}
zapsign.read-timeout-segundos=${ZAPSIGN_READ_TIMEOUT:20}
