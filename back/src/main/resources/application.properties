spring.application.name=pop

# Porta (Railway injeta PORT; localmente cai em 8080).
server.port=${PORT:8080}

# ===============================
# PostgreSQL DataSource
# Em produção, defina SPRING_DATASOURCE_URL/USERNAME/PASSWORD no ambiente.
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Logs — inclui o inquilino (schema) via MDC no padrão de log (multi-inquilino): "[inq:public]".
# O TenantFilter seta o MDC "inquilino"; fica vazio nas requisições sem inquilino resolvido.
# ===============================
logging.pattern.level=%5p [inq:%X{inquilino:-}]

# ===============================
# Autenticação (Spring Security / JWT)
# Em produção defina APP_JWT_SECRET (>= 32 bytes) no ambiente.
# ===============================
app.jwt.secret=${APP_JWT_SECRET:troque-este-segredo-de-desenvolvimento-para-producao-0001}
app.jwt.expiration-hours=${APP_JWT_EXPIRATION_HOURS:8}
# Sessão do paciente no app: longa duração (estilo WhatsApp), revogável pela troca de aparelho.
app.jwt.paciente-expiration-days=${APP_JWT_PACIENTE_EXPIRATION_DAYS:365}

# ===============================
# Chave-mestra dos segredos (AES-256-GCM) — cifra os tokens dos provedores de assinatura guardados no banco.
# 32 bytes em base64. Em produção, defina APP_SECRETS_KEY no ambiente (Railway). NUNCA troque depois de haver
# segredos salvos: a troca torna os valores já cifrados ilegíveis. O default abaixo é só para DESENVOLVIMENTO.
# ===============================
app.secrets.key=${APP_SECRETS_KEY:tq+McPMkmh4pOI/DZWFXGzh5lp37TK1cmVNYDrFacOg=}

# ===============================
# Flyway Migrations
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# Armazenamento de arquivos (MinIO / S3 — Railway)
# O upload é feito direto do navegador para o S3 via URL pré-assinada.
# Defina no Railway: MINIO_BUCKET, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD,
# MINIO_PUBLIC_ENDPOINT e (opcional) MINIO_PRIVATE_ENDPOINT.
# ===============================
storage.bucket=${MINIO_BUCKET:portal-paciente}
storage.access-key=${MINIO_ROOT_USER:}
storage.secret-key=${MINIO_ROOT_PASSWORD:}
# Endpoint público (usado nas URLs pré-assinadas que o navegador acessa).
storage.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
# Endpoint interno (usado pelo backend para operações servidor-a-servidor, ex.: excluir).
storage.internal-endpoint=${MINIO_PRIVATE_ENDPOINT:${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}}
storage.region=${MINIO_REGION:us-east-1}

# Permite upload de arquivos maiores no multipart do próprio Spring (não usado no fluxo S3 direto).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ===============================
# Twilio Verify (OTP do paciente por WhatsApp/SMS)
# Defina no ambiente: TWILIO_ACCOUNT_SID e TWILIO_AUTH_TOKEN (segredos).
# O Verify Service SID não é segredo (fica versionado). Sem as credenciais, a
# verificação falha de forma segura (503) — nunca libera acesso.
# ===============================
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}
# Idioma do OTP (SMS em pt-BR; e casa com o template de WhatsApp aprovado em pt_BR).
twilio.verify-locale=${TWILIO_VERIFY_LOCALE:pt-BR}
# SMS de texto livre (Twilio Messaging API) — usado pelo convite para baixar o app.
# Reusa account-sid/auth-token acima. Defina UM remetente: Messaging Service SID (preferido;
# o Twilio escolhe o número do pool) ou um número From em E.164. Sem remetente, o convite por
# SMS não é enviado (fail-open). O liga/desliga e os links de loja ficam em Configurações.
# Messaging Service de TESTE (tem precedência sobre o sms-from abaixo). Troque por um remetente
# apto ao Brasil (Sender ID alfanumérico registrado) para produção; sobrescrevível por env.
twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:MGe41df10a02473359f554fc5639e580fc}
# Número Twilio dos EUA, fallback de TESTE (entrega ao Brasil via long code internacional é
# não-confiável). Só é usado quando o Messaging Service acima está vazio.
twilio.sms-from=${TWILIO_SMS_FROM:+18102464163}

# ===============================
# Moderação de comentários por IA (Claude / Anthropic)
# Defina ANTHROPIC_API_KEY no ambiente. Sem a chave, a moderação falha de forma
# SEGURA (fail-closed): o comentário fica pendente para o admin revisar.
# ===============================
anthropic.api-key=${ANTHROPIC_API_KEY:}
# Modelo mais simples que resolve a classificação de ofensa.
anthropic.moderacao.modelo=${ANTHROPIC_MODERACAO_MODELO:claude-haiku-4-5}
# Timeout da chamada de moderação (segundos): estourou = fail-closed (pendente).
anthropic.moderacao.timeout-segundos=${ANTHROPIC_MODERACAO_TIMEOUT:12}

# ===============================
# Chat ao vivo com IA (assistente virtual do primeiro atendimento)
# Reaproveita a MESMA ANTHROPIC_API_KEY. Ao contrário da moderação, aqui a falha é FAIL-OPEN:
# se a IA não responder, a conversa é escalada na hora para atendimento humano.
# ===============================
# Modelo do chat: Haiku por padrão (baixo custo/latência); dá pra subir p/ um modelo maior por env.
anthropic.chat.modelo=${ANTHROPIC_CHAT_MODELO:claude-haiku-4-5}
# Teto de tokens da resposta ao paciente.
anthropic.chat.max-tokens=${ANTHROPIC_CHAT_MAX_TOKENS:600}
# Timeout da chamada (segundos): estourou = escala para humano (fail-open).
anthropic.chat.timeout-segundos=${ANTHROPIC_CHAT_TIMEOUT:20}
# Quantas mensagens recentes da conversa mandar como histórico para a IA.
anthropic.chat.historico-maximo=${ANTHROPIC_CHAT_HISTORICO:12}

# ===============================
# Análise de documentos do prontuário por IA
# Reaproveita a MESMA ANTHROPIC_API_KEY. Aqui a precisão pesa mais que o custo (ex.: laudo com
# indício de câncer) → modelo Opus por padrão; a IA é apoio e o alerta sempre exige validação humana.
# ===============================
# Modelo da análise clínica (mais capaz; configurável).
anthropic.prontuario.modelo=${ANTHROPIC_PRONTUARIO_MODELO:claude-opus-5}
# Teto de tokens do resumo/alerta.
anthropic.prontuario.max-tokens=${ANTHROPIC_PRONTUARIO_MAX_TOKENS:1500}
# Timeout da chamada (segundos): Opus + PDF é mais lento; estourou = fica "não analisado" (reanalisar).
anthropic.prontuario.timeout-segundos=${ANTHROPIC_PRONTUARIO_TIMEOUT:90}

# ===============================
# Assinatura eletrônica (ZapSign / Autentique / Clicksign)
# As CREDENCIAIS (tokens, webhook secrets) e o AMBIENTE (sandbox/produção) de cada provedor são geridos pelo
# cliente na tela "Provedores de assinatura" — ficam CIFRADOS no banco (tipo de config SEGREDO, protegido pela
# app.secrets.key), NÃO mais em variável de ambiente. Aqui só restam parâmetros de INFRA (timeouts + a URL da
# página-wrapper do widget Clicksign, que é do próprio back). O provedor ATIVO é a Configuração PROVEDOR_ASSINATURA.
# ===============================
zapsign.connect-timeout-segundos=${ZAPSIGN_CONNECT_TIMEOUT:5}
zapsign.read-timeout-segundos=${ZAPSIGN_READ_TIMEOUT:20}

autentique.connect-timeout-segundos=${AUTENTIQUE_CONNECT_TIMEOUT:5}
autentique.read-timeout-segundos=${AUTENTIQUE_READ_TIMEOUT:30}

# widget-page-base: URL base que o app/front usa para abrir a página-wrapper do widget (o back a serve em
# /assinatura/clicksign/widget) — local = http://localhost:8080; em produção, a URL do Railway.
clicksign.widget-page-base=${CLICKSIGN_WIDGET_PAGE_BASE:http://localhost:8080}
clicksign.connect-timeout-segundos=${CLICKSIGN_CONNECT_TIMEOUT:5}
clicksign.read-timeout-segundos=${CLICKSIGN_READ_TIMEOUT:30}

# ===============================
# DocuSign (assinatura eletrônica do TCLE) — provedor alternativo (eSignature REST v2.1, JWT Grant)
# Auth por JWT: assina um JWT (RS256 com a chave privada RSA) e troca por access token no OAuth (demo:
# account-d.docusign.com); as chamadas REST vão para a conta (account-base-uri, demo: demo.docusign.net).
# PRÉ-REQUISITO: consentimento único do usuário (JWT Grant) — veja GET /dev/docusign/status?redirect=...
# NENHUM segredo aqui: em dev, defina os valores em back/config/application.properties (git-ignored);
# em produção, defina as variáveis de ambiente no Railway. A chave privada é PKCS#8 (base64 do DER OU arquivo
# PEM). widget/retorno: retorno-page-base é a URL base que o app abre p/ a página de retorno da cerimônia.
# ===============================
docusign.oauth-base=${DOCUSIGN_OAUTH_BASE:https://account-d.docusign.com}
docusign.account-base-uri=${DOCUSIGN_ACCOUNT_BASE_URI:https://demo.docusign.net}
docusign.integration-key=${DOCUSIGN_INTEGRATION_KEY:}
docusign.user-id=${DOCUSIGN_USER_ID:}
docusign.account-id=${DOCUSIGN_API_ACCOUNT_ID:}
docusign.scope=${DOCUSIGN_SCOPE:signature impersonation}
docusign.private-key-base64=${DOCUSIGN_PRIVATE_KEY_BASE64:}
docusign.private-key-path=${DOCUSIGN_PRIVATE_KEY_PATH:}
docusign.webhook-secret=${DOCUSIGN_WEBHOOK_SECRET:}
docusign.webhook-url=${DOCUSIGN_WEBHOOK_URL:}
docusign.retorno-page-base=${DOCUSIGN_RETORNO_PAGE_BASE:http://localhost:8080}
# Coassinatura embutida (recipient view em iframe): origens que podem enquadrar + origens das mensagens do DocuSign.
# A coassinatura do profissional hoje abre em ABA nova, então isto só é usado se um dia for embutida no front.
docusign.frame-ancestors=${DOCUSIGN_FRAME_ANCESTORS:http://localhost:4200,https://apps-d.docusign.com}
docusign.message-origins=${DOCUSIGN_MESSAGE_ORIGINS:https://apps-d.docusign.com}
docusign.connect-timeout-segundos=${DOCUSIGN_CONNECT_TIMEOUT:10}
docusign.read-timeout-segundos=${DOCUSIGN_READ_TIMEOUT:60}
